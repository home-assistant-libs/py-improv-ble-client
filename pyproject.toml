[build-system]
requires = ["setuptools>=65.6,<85.0", "wheel>=0.37.1,<0.49.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "py-improv-ble-client"
version      = "2.0.1"
license      = {text = "MIT"}
description  = "API to provision devices which implement Improv via BLE"
readme       = "README.md"
requires-python = ">=3.11.0"

[project.urls]
"Homepage" = "https://github.com/home-assistant-libs/py-improv-ble-client"

[tool.setuptools]
platforms = ["any"]
zip-safe  = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["improv_ble_client*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # pydocstyle
    "D",
    # flake8-annotations
    "ANN",
    # isort
    "I",
]
ignore = [
    # Prefer no blank line before class docstrings.
    "D203",
    # Prefer multi-line docstring summaries on the first line.
    "D213",
]

[tool.ruff.lint.mccabe]
max-complexity = 25
